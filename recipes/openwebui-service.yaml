apiVersion: spark-fleet/v1
kind: Recipe
metadata:
  name: openwebui-service
  displayName: OpenWebUI
  description: Operator chat UI served independently of inference deployments.
spec:
  mode: service
  runtime: custom
  roles:
    - name: openwebui
      node: spark-01
      class: light
      startOrder: 0
      service:
        image: ghcr.io/open-webui/open-webui:main
        network_mode: host
        volumes:
          - /srv/spark-fleet/hub/openwebui:/app/backend/data
        environment:
          PORT: "3000"
          OPENAI_API_BASE_URL: http://127.0.0.1:8091/v1
          OPENAI_API_KEY: spark-active
        restart: unless-stopped
