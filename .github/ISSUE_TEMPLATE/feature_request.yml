name: Feature request
description: Suggest an improvement or new capability for spark-fleet
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the outcome you expect.
        Do not include secrets, real hostnames, IP addresses, host paths, or
        production recipes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API, UI, or recipe shape if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Controller API
        - Agent API
        - Gateway
        - Deployment lifecycle
        - Importer
        - Web UI
        - Recipes or rendering
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, real IPs/hostnames, and production recipe details.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
