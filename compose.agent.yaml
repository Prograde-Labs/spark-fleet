name: spark-fleet-agent

services:
  agent:
    build:
      context: .
      target: agent
    image: spark-fleet-agent:local
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    gpus: all
    environment:
      SPARK_FLEET_AGENT_HOST: ${SPARK_FLEET_AGENT_HOST:-0.0.0.0}
      SPARK_FLEET_AGENT_PORT: ${SPARK_FLEET_AGENT_PORT:-8092}
      SPARK_FLEET_AGENT_NODE_ID: ${SPARK_FLEET_AGENT_NODE_ID:-}
      SPARK_FLEET_AGENT_TOKEN: ${SPARK_FLEET_AGENT_TOKEN:?set SPARK_FLEET_AGENT_TOKEN}
      SPARK_FLEET_AGENT_DATA_DIR: /var/lib/spark-fleet-agent
      SPARK_FLEET_COMPOSE_PROJECTS_DIR: /var/lib/spark-fleet-agent/projects
      SPARK_FLEET_MODEL_CACHE_ROOTS: /srv/spark-fleet/hub
      SPARK_FLEET_LOG_LEVEL: ${SPARK_FLEET_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SPARK_FLEET_AGENT_DATA_HOST_DIR:-./agent-data}:/var/lib/spark-fleet-agent
      - ${SPARK_FLEET_MODEL_CACHE_HOST_DIR:-/srv/spark-fleet/hub}:/srv/spark-fleet/hub
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; host=os.environ.get('SPARK_FLEET_AGENT_HOST','0.0.0.0'); host='127.0.0.1' if host in ('0.0.0.0','::') else host; port=os.environ.get('SPARK_FLEET_AGENT_PORT','8092'); urllib.request.urlopen(f'http://{host}:{port}/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
